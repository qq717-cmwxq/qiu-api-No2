<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>qiuqiuのapi 🍎🍏</title>
<style>
    :root {
        --g: #34c759; --gl: rgba(52, 199, 89, 0.12); 
        --r: #ff3b30; --rl: rgba(255, 59, 48, 0.12); 
        --y: #ff9500; --yl: rgba(255, 149, 0, 0.12); 
        --b: #007aff; --bl: rgba(0, 122, 255, 0.12);
        --t: #1d1d1f; --tl: #86868b; 
        --bg: #f5f5f7; --cbg: rgba(255, 255, 255, 0.82); 
        --border: rgba(0, 0, 0, 0.06); --input-bg: rgba(118, 118, 128, 0.08);
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        --glass-blur: blur(20px);
    }

    body.dark-mode {
        --g: #30d158; --gl: rgba(48, 209, 88, 0.15); 
        --r: #ff453a; --rl: rgba(255, 69, 58, 0.15); 
        --y: #ffd60a; --yl: rgba(255, 214, 10, 0.15); 
        --b: #0a84ff; --bl: rgba(10, 132, 255, 0.15);
        --t: #f5f5f7; --tl: #98989d; 
        --bg: #000000; --cbg: rgba(28, 28, 30, 0.75); 
        --border: rgba(255, 255, 255, 0.1); --input-bg: rgba(120, 120, 128, 0.24);
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        --glass-blur: blur(25px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { 
        background-color: var(--bg); 
        background-image: radial-gradient(circle at 10% 10%, var(--gl) 0, transparent 50%), radial-gradient(circle at 90% 90%, var(--bl) 0, transparent 50%);
        background-attachment: fixed;
        color: var(--t); padding: 20px; padding-bottom: 120px; min-height: 100vh; 
        transition: background-color 0.4s, color 0.4s; 
    }

    .top-bar { background: var(--cbg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border-radius: 24px; padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border); position: relative; }
    h1 { font-size: 24px; font-weight: 700; text-align: center; color: var(--t); letter-spacing: -0.5px; margin-bottom: 15px; }
    .theme-btn { position: absolute; right: 18px; top: 18px; background: var(--input-bg); border: none; font-size: 16px; cursor: pointer; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; }
    .theme-btn:active { transform: scale(0.9); }
    
    .dashboard { display: flex; justify-content: space-around; text-align: center; font-size: 13px; color: var(--tl); }
    .dashboard span { display: block; font-size: 18px; font-weight: 600; color: var(--t); margin-top: 4px; letter-spacing: -0.3px; }
    .dashboard .clickable { cursor: pointer; padding: 6px 12px; border-radius: 12px; transition: background 0.2s; }
    .dashboard .clickable:active { background: var(--input-bg); }

    .toolbar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .search-box { flex: 1; min-width: 140px; position: relative; }
    .search-box input { width: 100%; padding: 12px 16px 12px 40px; border-radius: 14px; border: 1px solid var(--border); background: var(--cbg); backdrop-filter: var(--glass-blur); color: var(--t); font-size: 14px; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
    .search-box input:focus { border-color: var(--b); box-shadow: 0 0 0 4px var(--bl); }
    .search-box::before { content: '🔍'; position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 14px; }
    
    .btn-f, .btn-r, .btn-s { padding: 12px 18px; border-radius: 14px; font-size: 14px; font-weight: 600; border: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--cbg); backdrop-filter: var(--glass-blur); color: var(--t); transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1); white-space: nowrap; }
    .btn-f.ag { background: var(--g); color: #fff; border-color: var(--g); }
    .btn-f.ay { background: var(--y); color: #fff; border-color: var(--y); }
    .btn-r { color: var(--r); }
    .btn-s { color: var(--b); }
    .btn-f:active, .btn-r:active, .btn-s:active { transform: scale(0.96); opacity: 0.8; }

    .fab { position: fixed; bottom: 35px; right: 25px; width: 64px; height: 64px; border-radius: 50%; background: var(--b); color: #fff; font-size: 32px; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 28px rgba(0, 122, 255, 0.35); border: none; cursor: pointer; z-index: 99; transition: transform 0.2s, background 0.2s; }
    .fab:active { transform: scale(0.92); }

    .card { background: var(--cbg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border-radius: 24px; margin-bottom: 16px; box-shadow: var(--shadow); border: 1px solid var(--border); overflow: hidden; position: relative; transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.2s; }
    .card::before { content: ''; position: absolute; top: 0; left: 0; width: 5px; height: 100%; background: var(--g); transition: background 0.3s; }
    .card.uc::before { background: var(--r); }
    .card-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 22px 20px 24px; cursor: grab; user-select: none; }
    .site-name { font-size: 17px; font-weight: 700; color: var(--t); letter-spacing: -0.3px; }
    .toggle-icon { font-size: 18px; background: var(--input-bg); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; }
    .card-body { padding: 0 22px 22px 24px; display: block; }
    .card.collapsed .card-body { display: none; }

    .link-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 14px; }
    .site-link { font-size: 13px; color: var(--b); text-decoration: none; background: var(--bl); padding: 7px 14px; border-radius: 10px; font-weight: 600; transition: opacity 0.2s; }
    .site-link:active { opacity: 0.7; }
    .btn-copy { background: var(--input-bg); border: none; color: var(--tl); padding: 7px 12px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: color 0.2s, background 0.2s; }
    .btn-copy:active { opacity: 0.7; }
    
    .info-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; margin-bottom: 12px; }
    .info-label { color: var(--tl); font-size: 13px; font-weight: 500; }
    .balance { color: var(--r); font-weight: 700; font-size: 18px; letter-spacing: -0.5px; }

    .switch-container { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .switch-text { font-size: 13px; font-weight: 600; }
    .switch-text.un { color: var(--r); }
    .switch-text.si { color: var(--g); }
    .toggle-switch { position: relative; width: 48px; height: 28px; background-color: rgba(120, 120, 128, 0.3); border-radius: 28px; transition: 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
    .toggle-switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; background-color: #fff; border-radius: 50%; transition: 0.3s cubic-bezier(0.25, 1, 0.5, 1); box-shadow: 0 3px 8px rgba(0,0,0,0.15); }
    .toggle-switch.active { background-color: var(--g); }
    .toggle-switch.active::after { transform: translateX(20px); }

    .recharge-box { background: var(--yl); border-radius: 14px; padding: 14px; margin-bottom: 14px; font-size: 13px; color: var(--y); border: 1px solid rgba(255, 149, 0, 0.2); }
    .recharge-title { font-weight: 600; margin-bottom: 8px; border-bottom: 1px dashed rgba(255, 149, 0, 0.3); padding-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
    .recharge-list { display: flex; flex-direction: column; gap: 6px; }
    .recharge-item { display: flex; justify-content: space-between; font-size: 12px; opacity: 0.9; }
    .recharge-total { font-weight: 700; color: var(--r); font-size: 13px; }
    
    .url-box { background: var(--input-bg); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .url-info { display: flex; flex-direction: column; flex-grow: 1; overflow: hidden; }
    .url-label { font-size: 11px; color: var(--tl); font-weight: 600; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
    .url-text { font-size: 12px; color: var(--t); word-break: break-all; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    
    .auth-box { background: var(--bl); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px; border: 1px solid rgba(0, 122, 255, 0.15); }
    .auth-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .auth-info { display: flex; flex-direction: column; flex-grow: 1; overflow: hidden; }
    .auth-label { font-size: 11px; color: var(--b); font-weight: 600; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
    .auth-text { font-size: 13px; color: var(--t); word-break: break-all; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 600; }
    .btn-eye { background: transparent; border: none; font-size: 16px; cursor: pointer; padding: 4px; }
    
    .qq-box { background: var(--bl); border-radius: 14px; padding: 10px 14px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 1px solid rgba(0, 122, 255, 0.15); }
    .qq-info { display: flex; flex-direction: column; flex-grow: 1; overflow: hidden; }
    .qq-label { font-size: 11px; color: var(--b); font-weight: 600; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
    .qq-text { font-size: 13px; color: var(--t); font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    
    .model-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .model-item { background: var(--gl); border-radius: 10px; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; }
    .model-name { font-size: 13px; color: var(--g); font-weight: 600; }
    .model-price { font-size: 11px; color: #fff; font-weight: 600; background: var(--g); padding: 2px 8px; border-radius: 6px; }
    
    .remark-box { background: var(--input-bg); border-radius: 12px; padding: 12px; margin-bottom: 14px; }
    .remark-label { font-size: 11px; color: var(--tl); font-weight: 600; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .remark-text { font-size: 12px; color: var(--tl); line-height: 1.5; word-break: break-all; }

    .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    .btn-small { background: var(--input-bg); border: none; color: var(--tl); padding: 7px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn-edit { color: var(--g); background: var(--gl); }
    .btn-delete { color: var(--r); background: var(--rl); }
    .btn-small:active { opacity: 0.7; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 100; justify-content: center; align-items: flex-end; }
    .modal-content { background: var(--cbg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); color: var(--t); width: 100%; max-height: 88vh; border-radius: 28px 28px 0 0; padding: 24px; overflow-y: auto; animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1); border-top: 1px solid var(--border); box-shadow: 0 -20px 40px rgba(0,0,0,0.2); }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 12px; color: var(--tl); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; font-size: 14px; outline: none; background: var(--input-bg); color: var(--t); transition: border-color 0.2s, box-shadow 0.2s; }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--b); box-shadow: 0 0 0 4px var(--bl); }
    
    .dynamic-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .input-model { flex: 2; }
    .input-price { flex: 1; }
    .btn-remove-model { background: var(--rl); color: var(--r); border: none; padding: 0 14px; border-radius: 10px; font-weight: 600; cursor: pointer; height: 42px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .btn-add-model { background: var(--gl); color: var(--g); border: none; padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 600; width: 100%; cursor: pointer; margin-bottom: 12px; transition: opacity 0.2s; }
    .btn-add-model:active { opacity: 0.7; }
    
    .modal-actions { display: flex; gap: 12px; margin-top: 24px; }
    .btn-cancel { flex: 1; background: var(--input-bg); color: var(--t); border: none; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn-save { flex: 2; background: var(--b); color: #fff; border: none; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn-cancel:active, .btn-save:active { opacity: 0.8; }
    
    .empty-state { text-align: center; color: var(--tl); margin-top: 60px; font-size: 15px; font-weight: 500; }
    .hidden { display: none !important; }
    .dragging { opacity: 0.4; transform: scale(0.98); }

    .bill-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 14px; align-items: center; }
    .bill-total { font-size: 20px; font-weight: 700; color: var(--r); text-align: center; margin: 15px 0 20px 0; background: var(--rl); padding: 18px; border-radius: 16px; letter-spacing: -0.5px; }
</style>
</head>
<body>

<div class="top-bar">
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
    <h1>qiuqiuのapi</h1>
    <div class="dashboard">
        <div>待签到<span style="color:var(--r)" id="tu">0</span></div>
        <div class="clickable" onclick="openBillModal()">本月充值<span style="color:var(--b)" id="monthTotal">0</span></div>
        <div>总站点<span id="ts">0</span></div>
    </div>
</div>

<div class="toolbar">
    <div class="search-box">
        <input type="text" id="si" placeholder="搜索站点、用户名、模型..." oninput="rs()">
    </div>
    <button class="btn-f" id="fu" onclick="tf('unsign')">🍏 仅看未签</button>
    <button class="btn-f" id="fr" onclick="tf('recharge')">💰 仅看充值</button>
    <button class="btn-r" onclick="resSigns()">🔄 重置</button>
    <button class="btn-s" onclick="openSync()">☁️ 同步</button>
</div>

<div id="sl"></div>
<button class="fab" onclick="openForm()">+</button>

<div class="modal" id="billModal">
    <div class="modal-content">
        <h2 style="margin-bottom:20px; text-align:center; color:var(--b); font-size:20px;">📊 月度充值账单</h2>
        <div class="form-group">
            <label>选择要查看的月份：</label>
            <input type="month" id="billMonth" onchange="renderBill()">
        </div>
        <div id="billContent"></div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeBillModal()">关闭</button>
        </div>
    </div>
</div>

<div class="modal" id="syncModal">
    <div class="modal-content">
        <h2 style="margin-bottom:20px; text-align:center; color:var(--b); font-size:20px;">☁️ 数据备份与恢复</h2>
        <div class="form-group" style="border-bottom:1px solid var(--border); padding-bottom:20px">
            <label style="color:var(--b)">📤 导出数据</label>
            <p style="font-size:12px; color:var(--tl); margin-bottom:12px">可以安全地备份或只导出今天新增的站点！</p>
            <button type="button" class="btn-add-model" style="background:var(--bl); color:var(--b)" onclick="expFile('all')">💾 下载全部文件备份</button>
            <button type="button" class="btn-add-model" style="background:var(--gl); color:var(--g)" onclick="expFile('today')">✨ 只下载今天新增的站点</button>
            
            <label style="margin-top:15px">或者：文本快速复制</label>
            <textarea id="expTxt" style="min-height:60px; font-family:monospace; font-size:12px; margin-bottom:8px" placeholder="生成的文本会显示在这里..."></textarea>
            <button type="button" class="btn-copy" style="width:100%; padding:12px; margin-bottom:6px; background:var(--bl); color:var(--b); border-radius:12px;" onclick="expTxt('all')">📋 复制全部文本</button>
            <button type="button" class="btn-copy" style="width:100%; padding:12px; background:var(--gl); color:var(--g); border-radius:12px;" onclick="expTxt('today')">📋 复制今天新增文本</button>
        </div>
        <div class="form-group" style="padding-top:10px">
            <label style="color:var(--g)">📥 导入数据（自动去重合并）</label>
            <p style="font-size:12px; color:var(--tl); margin-bottom:12px">遇到同名字段自动跳过，安全不覆盖。</p>
            <input type="file" id="impFile" accept=".json" style="display:none" onchange="impFile(event)">
            <button type="button" class="btn-add-model" style="background:var(--input-bg); color:var(--g); border:1px dashed var(--g)" onclick="document.getElementById('impFile').click()">📂 选择 JSON 文件合并</button>
            
            <label style="margin-top:15px">或者：粘贴文本导入</label>
            <textarea id="impTxt" style="min-height:60px; font-family:monospace; font-size:12px; margin-bottom:8px" placeholder="在此粘贴刚才复制的文本..."></textarea>
            <button type="button" class="btn-add-model" style="background:var(--g); color:#fff" onclick="impTxt()">✅ 确认导入合并</button>
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeSync()">关闭</button>
        </div>
    </div>
</div>

<div class="modal" id="formModal">
    <div class="modal-content">
        <h2 id="mt" style="margin-bottom:20px; text-align:center; color:var(--t); font-size:20px;">添加新站点</h2>
        <input type="hidden" id="eid">
        
        <div class="form-group"><label>站点名称 *</label><input type="text" id="sn" placeholder="例如：某某 API"></div>
        <div class="form-group"><label>站点链接</label><input type="url" id="su" placeholder="https://..."></div>
        
        <div class="form-group">
            <label>是否支持签到？</label>
            <select id="ss" onchange="tso()"><option value="是">支持</option><option value="否">不支持</option></select>
        </div>
        <div id="sd" class="form-group">
            <label>今日是否已签到？</label>
            <select id="is"><option value="否">未签到</option><option value="是">已签到 ✅</option></select>
        </div>
        <div id="cg" class="form-group">
            <label>签到条件</label>
            <input type="text" id="sc" placeholder="例如：需满10元">
        </div>
        
        <div class="form-group"><label>当前余额</label><input type="text" id="bal" placeholder="例如：25.5"></div>
        
        <div class="form-group" style="background:var(--yl); padding:16px; border-radius:16px; border:1px solid rgba(255,149,0,0.2)">
            <label style="color:var(--y)">💰 充值记录流水</label>
            <div id="rc"></div>
            <button type="button" class="btn-add-model" style="background:rgba(255,255,255,0.5); color:var(--y); margin-top:8px;" onclick="addR()">+ 记录一笔充值</button>
        </div>
        
        <div class="form-group" style="background:var(--input-bg); padding:16px; border-radius:16px;">
            <label>专属 URL</label>
            <input type="text" id="cu" placeholder="用于复制的专属链接" style="background:var(--cbg)">
        </div>
        
        <div class="form-group" style="background:var(--bl); padding:16px; border-radius:16px; border:1px solid rgba(0,122,255,0.15)">
            <label style="color:var(--b)">🔐 专属用户名和密码</label>
            <input type="text" id="au" placeholder="输入用户名" style="background:var(--cbg); margin-bottom:8px;">
            <input type="text" id="ap" placeholder="输入密码" style="background:var(--cbg);">
        </div>
        
        <div class="form-group" style="background:var(--bl); padding:16px; border-radius:16px; border:1px solid rgba(0,122,255,0.15)">
            <label style="color:var(--b)">🐧 官方 QQ 群号</label>
            <input type="number" id="qg" placeholder="群号" style="background:var(--cbg);">
        </div>
        
        <div class="form-group">
            <label style="color:var(--g)">🍏 好吃模型列表</label>
            <div id="mc"></div>
            <button type="button" class="btn-add-model" onclick="addM()">+ 添加一个模型</button>
        </div>
        
        <div class="form-group"><label>额外备注</label><textarea id="rm" placeholder="记录点什么..."></textarea></div>
        
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeForm()">取消</button>
            <button class="btn-save" onclick="saveSite()">保存</button>
        </div>
    </div>
</div>

<script>
    function checkAutoTheme() {
        const hour = new Date().getHours();
        const shouldBeDark = (hour >= 21 || hour < 6);
        if (shouldBeDark) {
            document.body.classList.add('dark-mode');
            document.getElementById('themeBtn').innerText = '☀️';
        } else {
            document.body.classList.remove('dark-mode');
            document.getElementById('themeBtn').innerText = '🌙';
        }
    }
    checkAutoTheme();
    setInterval(checkAutoTheme, 60000);

    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        document.getElementById('themeBtn').innerText = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
    }

    let lastVisit = localStorage.getItem('lastVisitDate');
    let today = new Date().toLocaleDateString();
    let sites = JSON.parse(localStorage.getItem('mySitesV17')) || [];

    if (lastVisit !== today) {
        if (sites.length > 0) {
            sites.forEach(s => { if (s.supportSign === '是') s.isSigned = '否'; });
            localStorage.setItem('mySitesV17', JSON.stringify(sites));
        }
        localStorage.setItem('lastVisitDate', today);
    }

    let isEditing = false;
    let currentFilter = 'none';
    let searchKeyword = '';
    let draggedIndex = null;

    function updateMonthlyTotal() {
        let now = new Date();
        let currentMonth = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
        
        let monthlyTotal = 0;
        sites.forEach(site => {
            if (site.recharges && site.recharges.length > 0) {
                site.recharges.forEach(r => {
                    if (r.date && r.date.startsWith(currentMonth)) {
                        const amt = parseFloat(r.amount);
                        if (!isNaN(amt)) monthlyTotal += amt;
                    }
                });
            }
        });
        const el = document.getElementById('monthTotal');
        if (el) el.innerText = monthlyTotal.toFixed(1);
    }

    function openBillModal() {
        let now = new Date();
        let currentMonth = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
        document.getElementById('billMonth').value = currentMonth;
        renderBill();
        document.getElementById('billModal').style.display = 'flex';
    }

    function closeBillModal() {
        document.getElementById('billModal').style.display = 'none';
    }

    function renderBill() {
        const targetMonth = document.getElementById('billMonth').value;
        if (!targetMonth) return;
        
        let grandTotal = 0;
        let html = '';
        
        sites.forEach(site => {
            let siteTotal = 0;
            if (site.recharges && site.recharges.length > 0) {
                site.recharges.forEach(r => {
                    if (r.date && r.date.startsWith(targetMonth)) {
                        const amt = parseFloat(r.amount);
                        if (!isNaN(amt)) siteTotal += amt;
                    }
                });
            }
            if (siteTotal > 0) {
                grandTotal += siteTotal;
                html += `<div class="bill-row"><span>${site.name}</span><span style="color:var(--r); font-weight:600;">+${siteTotal.toFixed(1)}</span></div>`;
            }
        });
        
        let mStr = targetMonth;
        if(targetMonth.includes('-')){
            let parts = targetMonth.split('-');
            mStr = parts[0] + '年' + parts[1] + '月';
        }

        let content = `<div class="bill-total">${mStr}总充值：${grandTotal.toFixed(1)}</div>`;
        if (html === '') {
            content += `<div style="text-align:center; color:var(--tl); padding:20px;">该月没有任何充值记录</div>`;
        } else {
            content += html;
        }
        document.getElementById('billContent').innerHTML = content;
    }

    function openSync() {
        document.getElementById('expTxt').value = '';
        document.getElementById('impTxt').value = '';
        document.getElementById('impFile').value = '';
        document.getElementById('syncModal').style.display = 'flex';
    }
    function closeSync() { document.getElementById('syncModal').style.display = 'none'; }

    function expFile(mode) {
        if (!sites.length) return alert('无数据');
        let dataToExport = sites;
        if (mode === 'today') {
            const todayStr = new Date().toISOString().split('T')[0];
            dataToExport = sites.filter(s => s.createDate === todayStr);
            if (dataToExport.length === 0) return alert('今天还没有新增站点哦~');
        }
        const b = new Blob([JSON.stringify(dataToExport, null, 2)], {type: "application/json"}); 
        const u = URL.createObjectURL(b); 
        const a = document.createElement('a'); 
        a.href = u; 
        a.download = `qiuqiu_backup_${mode}_${new Date().toISOString().slice(0, 10)}.json`; 
        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(u); 
    }

    function expTxt(mode) { 
        if (!sites.length) return alert('无数据'); 
        let dataToExport = sites;
        if (mode === 'today') {
            const todayStr = new Date().toISOString().split('T')[0];
            dataToExport = sites.filter(s => s.createDate === todayStr);
            if (dataToExport.length === 0) return alert('今天还没有新增站点哦~');
        }
        const s = JSON.stringify(dataToExport); 
        document.getElementById('expTxt').value = s; 
        navigator.clipboard.writeText(s).then(() => alert('✅ 已复制到剪贴板')).catch(() => alert('请手动长按上方文本框复制')); 
    }

    function processImportData(parsedData) {
        if (!Array.isArray(parsedData)) { alert('❌ 导入失败：数据格式不正确'); return; }
        if (parsedData.length === 0) { alert('⚠️ 导入的文件里没有数据'); return; }
        
        const existingNames = new Set(sites.map(s => s.name));
        let addedCount = 0;
        let skippedCount = 0;
        
        parsedData.forEach(newSite => {
            if (existingNames.has(newSite.name)) {
                skippedCount++;
            } else {
                sites.push(newSite);
                existingNames.add(newSite.name);
                addedCount++;
            }
        });
        
        alert(`🎉 导入完成！\n成功新增: ${addedCount} 个\n自动跳过(已存在): ${skippedCount} 个`);
        sd(); rs(); closeSync();
    }

    function impFile(e) { 
        const f = e.target.files[0]; if (!f) return; 
        const r = new FileReader(); 
        r.onload = function(e) {
            try { processImportData(JSON.parse(e.target.result)); } 
            catch (err) { alert('❌ 导入失败：文件解析错误'); } 
        }; 
        r.readAsText(f); 
    }
    function impTxt() { 
        const s = document.getElementById('impTxt').value.trim(); 
        if (!s) return alert('请先粘贴数据'); 
        try { processImportData(JSON.parse(s)); } 
        catch (e) { alert('❌ 导入失败：文本格式错误'); } 
    }

    function ud() { 
        let tu = 0; 
        sites.forEach(s => { 
            if (s.supportSign === '是' && s.isSigned === '否') tu++; 
        }); 
        document.getElementById('ts').innerText = sites.length; 
        document.getElementById('tu').innerText = tu; 
        updateMonthlyTotal(); 
    }

    function tf(t) { 
        currentFilter = (currentFilter === t) ? 'none' : t; 
        document.getElementById('fu').className = currentFilter === 'unsign' ? 'btn-f ag' : 'btn-f'; 
        document.getElementById('fr').className = currentFilter === 'recharge' ? 'btn-f ay' : 'btn-f'; 
        rs(); 
    }

    function resSigns() { 
        if (confirm('重置所有签到状态？')) { 
            sites.forEach(s => { if (s.supportSign === '是') s.isSigned = '否'; }); 
            sd(); rs(); 
        } 
    }

    function tso() { 
        const v = document.getElementById('ss').value === '是'; 
        document.getElementById('sd').classList.toggle('hidden', !v); 
        document.getElementById('cg').classList.toggle('hidden', !v); 
    }

    function addM(n = '', p = '') { 
        const c = document.getElementById('mc'); 
        const d = document.createElement('div'); 
        d.className = 'dynamic-row'; 
        d.innerHTML = `<input type="text" class="input-model mn" value="${n}" placeholder="名称"><input type="text" class="input-price mp" value="${p}" placeholder="价格"><button type="button" class="btn-remove-model" onclick="this.parentElement.remove()">×</button>`; 
        c.appendChild(d); 
    }

    function addR(date = '', amount = '') {
        const c = document.getElementById('rc'); 
        const d = document.createElement('div'); 
        d.className = 'dynamic-row';
        const defaultDate = date || new Date().toISOString().split('T')[0];
        d.innerHTML = `<input type="date" class="input-model r-date" value="${defaultDate}"><input type="text" class="input-price r-amount" value="${amount}" placeholder="金额"><button type="button" class="btn-remove-model" onclick="this.parentElement.remove()">×</button>`;
        c.appendChild(d);
    }

    function tp(i) { 
        const p = document.getElementById('p' + i), e = document.getElementById('e' + i); 
        if (p.innerText === '••••••') { p.innerText = sites[i].accountPass; e.innerText = '🙈'; } 
        else { p.innerText = '••••••'; e.innerText = '👁️'; } 
    }

    function rs() {
        const l = document.getElementById('sl'); 
        l.innerHTML = ''; 
        searchKeyword = document.getElementById('si').value.toLowerCase();

        sites.forEach((site,index) => {
            if (currentFilter === 'unsign' && !(site.supportSign === '是' && site.isSigned === '否')) return;
            if (currentFilter === 'recharge' && !(site.recharges && site.recharges.length > 0)) return;

            let sc = site.name + (site.remark || '') + (site.customUrl || '') + (site.qqGroup || '') + (site.accountUser || '');
            if (site.foodModels) site.foodModels.forEach(m => { sc += (m.name + m.price); });
            if (searchKeyword && !sc.toLowerCase().includes(searchKeyword)) return;

            let sh = '';
            if (site.supportSign === '是') {
                const si = site.isSigned === '是'; 
                sh = `<div class="info-row"><span class="info-label">签到状态</span><div class="switch-container" onclick="event.stopPropagation();togS(${index})"><span class="switch-text ${si ? 'si' : 'un'}">${si ? '已签到' : '未签到'}</span><div class="toggle-switch ${si ? 'active' : ''}"></div></div></div>${site.condition ? `<div class="info-row"><span class="info-label">条件</span><span class="info-value" style="color:var(--y); font-weight:600;">${site.condition}</span></div>` : ''}`;
            }

            let mh = ''; 
            if (site.foodModels && site.foodModels.length > 0) {
                const ms = site.foodModels.map(m => `<div class="model-item"><span class="model-name">${m.name}</span>${m.price ? `<span class="model-price">💰 ${m.price}</span>` : ''}</div>`).join(''); 
                if (ms) mh = `<div class="model-grid">${ms}</div>`;
            }

            let uh = site.customUrl ? `<div class="url-box"><div class="url-info"><div class="url-label">专属 URL</div><div class="url-text">${site.customUrl}</div></div><button class="btn-copy" onclick="event.stopPropagation();cp('${site.customUrl}',this)">📋 复制</button></div>` : '';
            
            let ah = (site.accountUser || site.accountPass) ? `<div class="auth-box">${site.accountUser ? `<div class="auth-row"><div class="auth-info"><div class="auth-label">🔑 用户名</div><div class="auth-text">${site.accountUser}</div></div><button class="btn-copy" onclick="event.stopPropagation();cp('${site.accountUser}',this)">📋 复制</button></div>` : ''}${site.accountPass ? `<div class="auth-row"><div class="auth-info"><div class="auth-label">🔒 密码</div><div class="auth-text" id="p${index}">••••••</div></div><button class="btn-eye" id="e${index}" onclick="event.stopPropagation();tp(${index})">👁️</button><button class="btn-copy" onclick="event.stopPropagation();cp('${site.accountPass}',this)">📋 复制</button></div>` : ''}</div>` : '';
            
            let qh = site.qqGroup ? `<div class="qq-box"><div class="qq-info"><div class="qq-label">🐧 官方 QQ 群</div><div class="qq-text">${site.qqGroup}</div></div><button class="btn-copy" onclick="event.stopPropagation();cp('${site.qqGroup}',this)">📋 复制</button></div>` : '';

            let rh = '';
            if (site.recharges && site.recharges.length > 0) {
                let total = 0;
                let now = new Date();
                let currentMonth = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
                
                let monthTotal = 0;
                const listItems = site.recharges.map(r => {
                    const amt = parseFloat(r.amount);
                    if (!isNaN(amt)) {
                        total += amt;
                        if (r.date && r.date.startsWith(currentMonth)) monthTotal += amt;
                    }
                    return `<div class="recharge-item"><span>${r.date || '未知'}</span><span>+${r.amount || 0}</span></div>`;
                }).join('');
                
                let monthTitle = monthTotal > 0 ? `<span style="color:var(--y); font-size:11px; margin-left:8px;">(本月: ${monthTotal.toFixed(1)})</span>` : '';
                rh = `<div class="recharge-box"><div class="recharge-title"><span>💰 充值流水 ${monthTitle}</span><span class="recharge-total">总计: ${total.toFixed(1)}</span></div><div class="recharge-list">${listItems}</div></div>`;
            }

            let rkh = site.remark ? `<div class="remark-box"><div class="remark-label">备注</div><div class="remark-text">${site.remark}</div></div>` : '';
            
            const c = document.createElement('div'); 
            const ic = site.isCollapsed ? 'collapsed' : ''; 
            const cc = (site.supportSign === '是' && site.isSigned === '否') ? 'uc' : ''; 
            c.className = `card ${ic} ${cc}`;

            c.setAttribute('draggable', 'true');
            c.setAttribute('data-index', index);
            c.addEventListener('dragstart', handleDragStart);
            c.addEventListener('dragover', handleDragOver);
            c.addEventListener('drop', handleDrop);
            c.addEventListener('dragend', handleDragEnd);

            c.innerHTML = `
                <div class="card-header" onclick="togC(${index})">
                    <div class="site-name">${site.name}</div>
                    <div class="toggle-icon">${ic ? '🍎' : '🍏'}</div>
                </div>
                <div class="card-body">
                    <div class="link-row">
                        ${site.url ? `<a href="${site.url.startsWith('http') ? site.url : 'https://' + site.url}" target="_blank" class="site-link">🔗 访问</a><button class="btn-copy" onclick="event.stopPropagation();cp('${site.url}',this)">📋 复制</button>` : ''}
                    </div>
                    ${sh}
                    <div class="info-row"><span class="info-label">当前余额</span><span class="balance">${site.balance || '0'}</span></div>
                    ${rh}${uh}${ah}${qh}${mh}${rkh}
                    <div class="actions">
                        <button class="btn-small btn-edit" onclick="event.stopPropagation();edS(${index})">编辑</button>
                        <button class="btn-small btn-delete" onclick="event.stopPropagation();delS(${index})">删除</button>
                    </div>
                </div>`;
            l.appendChild(c); 
        });

        if (l.innerHTML === '') l.innerHTML = '<div class="empty-state">没有符合条件的站点~</div>'; 
        ud(); 
    }

    function handleDragStart(e) { 
        draggedIndex = this.getAttribute('data-index'); 
        this.classList.add('dragging'); 
        e.dataTransfer.effectAllowed = 'move'; 
        e.dataTransfer.setData('text/plain', draggedIndex); 
    }
    function handleDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
    function handleDrop(e) {
        e.preventDefault();
        const targetCard = e.target.closest('.card');
        if (targetCard && draggedIndex !== null) {
            const targetIndex = targetCard.getAttribute('data-index');
            if (draggedIndex !== targetIndex) {
                const draggedItem = sites[draggedIndex];
                sites.splice(draggedIndex, 1);
                sites.splice(targetIndex, 0, draggedItem);
                sd(); rs();
            }
        }
    }
    function handleDragEnd(e) { 
        document.querySelectorAll('.card').forEach(c => c.classList.remove('dragging')); 
        draggedIndex = null; 
    }

    function togS(i) { sites[i].isSigned = sites[i].isSigned === '是' ? '否' : '是'; sd(); rs(); }
    function togC(i) { sites[i].isCollapsed = !sites[i].isCollapsed; sd(); rs(); }
    function cp(t, b) { 
        let s = t.startsWith('http') || !t.includes('.') ? t : 'https://' + t; 
        navigator.clipboard.writeText(s).then(() => { 
            const o = b.innerHTML; b.innerHTML = '✅ 已复制'; 
            setTimeout(() => b.innerHTML = o, 1500); 
        }).catch(() => alert('复制失败')); 
    }
    function sd() { localStorage.setItem('mySitesV17', JSON.stringify(sites)); }

    function openForm() {
        isEditing = false; 
        document.getElementById('mt').innerText = '添加新站点'; 
        document.getElementById('eid').value = '';
        document.getElementById('sn').value = ''; document.getElementById('su').value = ''; document.getElementById('ss').value = '是';
        document.getElementById('is').value = '否'; document.getElementById('sc').value = ''; document.getElementById('bal').value = '';
        document.getElementById('cu').value = ''; document.getElementById('au').value = ''; document.getElementById('ap').value = ''; document.getElementById('qg').value = ''; document.getElementById('rm').value = '';
        document.getElementById('rc').innerHTML = '';
        document.getElementById('mc').innerHTML = ''; 
        addM(); tso(); 
        document.getElementById('formModal').style.display = 'flex';
    }
    function closeForm() { document.getElementById('formModal').style.display = 'none'; }

    function saveSite() {
        const n = document.getElementById('sn').value.trim(); 
        if (!n) return alert('名称不能为空');
        
        const mns = document.querySelectorAll('.mn'), mps = document.querySelectorAll('.mp'), fms = [];
        for (let i = 0; i < mns.length; i++) { 
            const mn = mns[i].value.trim(), mp = mps[i].value.trim(); 
            if (mn || mp) fms.push({name: mn || '未命名', price: mp}); 
        }

        const rds = document.querySelectorAll('.r-date'), ras = document.querySelectorAll('.r-amount'), rcs = [];
        for (let i = 0; i < rds.length; i++) {
            const d = rds[i].value.trim();
            const a = ras[i].value.trim();
            if (d || a) rcs.push({date: d, amount: a});
        }

        const d = {
            name: n, url: document.getElementById('su').value.trim(), supportSign: document.getElementById('ss').value,
            isSigned: document.getElementById('is').value, condition: document.getElementById('sc').value.trim(),
            balance: document.getElementById('bal').value.trim(), recharges: rcs,
            customUrl: document.getElementById('cu').value.trim(), accountUser: document.getElementById('au').value.trim(),
            accountPass: document.getElementById('ap').value.trim(), qqGroup: document.getElementById('qg').value.trim(),
            foodModels: fms, remark: document.getElementById('rm').value.trim(),
            isCollapsed: isEditing ? sites[document.getElementById('eid').value].isCollapsed : false,
            createDate: isEditing ? sites[document.getElementById('eid').value].createDate : new Date().toISOString().split('T')[0]
        };
        
        if (isEditing) sites[document.getElementById('eid').value] = d;
        else sites.push(d);
        
        sd(); closeForm(); rs();
    }

    function edS(i) {
        isEditing = true; 
        const s = sites[i];
        document.getElementById('mt').innerText = '编辑站点'; 
        document.getElementById('eid').value = i;
        document.getElementById('sn').value = s.name; document.getElementById('su').value = s.url || ''; document.getElementById('ss').value = s.supportSign || '是';
        document.getElementById('is').value = s.isSigned || '否'; document.getElementById('sc').value = s.condition || ''; document.getElementById('bal').value = s.balance || '';
        document.getElementById('cu').value = s.customUrl || ''; document.getElementById('au').value = s.accountUser || ''; document.getElementById('ap').value = s.accountPass || ''; document.getElementById('qg').value = s.qqGroup || ''; document.getElementById('rm').value = s.remark || '';

        document.getElementById('rc').innerHTML = '';
        if (s.recharges && s.recharges.length > 0) {
            s.recharges.forEach(r => addR(r.date, r.amount));
        } else if (s.hasRecharge === '是' && s.rechargeAmount) {
            addR(s.rechargeDate || '', s.rechargeAmount);
        }

        document.getElementById('mc').innerHTML = '';
        if (s.foodModels && s.foodModels.length > 0) s.foodModels.forEach(m => addM(m.name, m.price));
        else addM();
        
        tso(); 
        document.getElementById('formModal').style.display = 'flex';
    }

    function delS(i) { 
        if (confirm('确定删除？')) { 
            sites.splice(i, 1); 
            sd(); rs(); 
        } 
    }

    rs();
</script>
</body>
</html>
